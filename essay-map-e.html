<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>申論題重點樹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style>
/* ===== 色票：森林樹枝（淺色＝晨光森林） ===== */
:root{
  --paper:#F3EEE2; --sheet:#FAF7EE; --ink:#2B3527; --ink2:#4A5643; --muted:#6B7563;
  --line:#DCD3BF; --hair:#EAE3D2;
  --moss:#5B7742; --moss-d:#3E5530; --sprout:#8DB84A;
  --bark:#6E5139; --bark-d:#4B3726; --bark-l:#9A7752; --bark-lit:#B08350;
  --ground:#CDBF9E; --grass:#7E9F4A;
  --ripe:#C98A2B; --ripe-bg:#F6E4BC; --petal:#EBA58F; --petal-c:#E0B23C;
  /* 背過了＝秋葉金：底色漸層＋飽和描邊＋深色字點綴 */
  --gold-a:#FBE6A6; --gold-b:#F1C25E; --gold-e:#B8741A; --gold-ink:#8A520C; --gold-glow:rgba(200,130,30,.28);
  --berry:#B8741A; --berry-ink:#FFF8E6; --bloom-p:#E8857A; --bloom-c:#F6D160;
  --cover:#5B7742; --cover-ink:#F3EEE2;
  --plaque:#6E5139; --plaque-ink:#FAF7EE;
  --l1:#E5EFD0; --e1:#A9C77A; --l2:#DCEBDD; --e2:#8DB89A; --l3:#ECEDCF; --e3:#BFC27A;
  --l4:#E0ECD6; --e4:#9DBE86; --l5:#E8F0DA; --e5:#B3CC8C;
  --focus:#3E5530; --fly:#F5D76E; --fly-on:none; --hotfx:none;
  --lift:#fff; --liftp:45%; --halo:rgba(91,119,66,.28);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1712; --sheet:#142019; --ink:#E4E8D8; --ink2:#C0C9B4; --muted:#8E9A86;
    --line:#263529; --hair:#1C2A20;
    --moss:#8DAF6A; --moss-d:#B5D08F; --sprout:#A7CF6E;
    --bark:#7B5E44; --bark-d:#4F3B2A; --bark-l:#A0805E; --bark-lit:#D2A867;
    --ground:#2E3A2B; --grass:#4F6E3A;
    --ripe:#E2B24F; --ripe-bg:#3A3118; --petal:#E9A48C; --petal-c:#F5D76E;
    --gold-a:#5A4410; --gold-b:#463208; --gold-e:#F2BE4A; --gold-ink:#FFD877; --gold-glow:rgba(242,190,74,.32);
    --berry:#F2BE4A; --berry-ink:#2A1E05; --bloom-p:#F29A8C; --bloom-c:#FFE07A;
    --cover:#2F4A2C; --cover-ink:#E4E8D8;
    --plaque:#5A4532; --plaque-ink:#F3EBD8;
    --l1:#1E3322; --e1:#3F6338; --l2:#1A3128; --e2:#3A6450; --l3:#262F1C; --e3:#5E6A36;
    --l4:#1C3020; --e4:#46683F; --l5:#213422; --e5:#557447;
    --focus:#F5D76E; --fly:#F5D76E; --fly-on:block; --hotfx:drop-shadow(0 0 5px rgba(245,215,110,.55));
    --lift:#fff; --liftp:12%; --halo:rgba(181,208,143,.30);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1712; --sheet:#142019; --ink:#E4E8D8; --ink2:#C0C9B4; --muted:#8E9A86;
  --line:#263529; --hair:#1C2A20;
  --moss:#8DAF6A; --moss-d:#B5D08F; --sprout:#A7CF6E;
  --bark:#7B5E44; --bark-d:#4F3B2A; --bark-l:#A0805E; --bark-lit:#D2A867;
  --ground:#2E3A2B; --grass:#4F6E3A;
  --ripe:#E2B24F; --ripe-bg:#3A3118; --petal:#E9A48C; --petal-c:#F5D76E;
  --gold-a:#5A4410; --gold-b:#463208; --gold-e:#F2BE4A; --gold-ink:#FFD877; --gold-glow:rgba(242,190,74,.32);
  --berry:#F2BE4A; --berry-ink:#2A1E05; --bloom-p:#F29A8C; --bloom-c:#FFE07A;
  --cover:#2F4A2C; --cover-ink:#E4E8D8;
  --plaque:#5A4532; --plaque-ink:#F3EBD8;
  --l1:#1E3322; --e1:#3F6338; --l2:#1A3128; --e2:#3A6450; --l3:#262F1C; --e3:#5E6A36;
  --l4:#1C3020; --e4:#46683F; --l5:#213422; --e5:#557447;
  --focus:#F5D76E; --fly:#F5D76E; --fly-on:block; --hotfx:drop-shadow(0 0 5px rgba(245,215,110,.55));
  --lift:#fff; --liftp:12%; --halo:rgba(181,208,143,.30);
}

/* ===== 基礎 ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:1rem;line-height:1.75;transition:background-color .4s ease,color .4s ease}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.kai{font-family:"LXGW WenKai TC","Noto Serif TC",serif}
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:none;overflow:visible;pointer-events:none}/* 圖示不吃滑鼠：命中範圍永遠是外層按鈕／標籤，圖示怎麼動都不會改變 hover 判定 */
.ic *{transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}

.wrap{max-width:1600px;margin:0 auto;padding:clamp(24px,4vw,52px) clamp(16px,3vw,44px) 72px;display:flex;flex-direction:column;min-width:0}
.wrap>*{min-width:0;max-width:100%}

/* ===== 頁首 ===== */
.head{display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:start;padding-bottom:22px;border-bottom:1px solid var(--line)}
.head h1{grid-column:1;margin:0;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-weight:700;
  font-size:clamp(1.7rem,4.4vw,2.5rem);line-height:1.25;letter-spacing:.05em;display:flex;align-items:center;gap:.4em}
.head h1 .ic{width:1.05em;height:1.05em;color:var(--moss)}
.sub{grid-column:1 / -1;margin:2px 0 0;color:var(--ink2);font-size:.9rem;max-width:48em;line-height:1.8}
.theme{grid-column:2;grid-row:1;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer;color:var(--ink2);font-size:13px;white-space:nowrap;
  transition:border-color .2s,color .2s,background-color .4s}
.theme:hover{border-color:var(--moss);color:var(--ink)}
.theme .ic{width:18px;height:18px}

/* 評分比重：年輪 */
.grade{grid-column:1 / -1;margin-top:16px;display:flex;flex-wrap:wrap;gap:12px 28px}
.g{display:flex;align-items:center;gap:10px;min-width:0}
.ring{width:42px;height:42px;flex:none;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--hair);stroke-width:4}
.ring .yr{fill:none;stroke:var(--line);stroke-width:1}
.ring .arc{fill:none;stroke:var(--moss);stroke-width:4;stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray 1.2s cubic-bezier(.3,.7,.2,1)}
.g .gl{display:flex;flex-direction:column;line-height:1.3}
.g .gl span{font-size:.78rem;color:var(--muted)}
.g .gl b small{font-size:.72em;margin-left:1px;color:var(--muted)}
.g .gl b{font-family:"Noto Serif TC",serif;font-weight:600;font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}

/* ===== 題目分頁 ===== */
.tabs{display:flex;gap:4px;margin-top:24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;cursor:pointer;background:none;border:0;
  padding:10px 14px 13px;color:var(--muted);font-size:.86rem;position:relative;transition:color .2s}
.tab .n{font-family:"LXGW WenKai TC",serif;font-weight:700;font-size:1.08rem}
.tab .pg{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;opacity:.85}
.tab .ic{width:15px;height:15px;color:var(--moss);transform:scale(0) rotate(-60deg);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.tab::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px;background:var(--moss);
  transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.tab:hover{color:var(--ink)}
.tab:hover .ic{transform:scale(.7) rotate(-20deg)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .ic{transform:scale(1) rotate(0)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tab.all .pg{color:var(--ripe);opacity:1}

/* ===== 控制列 ===== */
.ctl{display:flex;flex-wrap:wrap;gap:12px 22px;justify-content:space-between;align-items:center;margin:18px 0 16px}
.ctl .lft{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.seg{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.seg .t{display:inline-flex;align-items:center;gap:5px}
.seg .t .ic{color:var(--moss)}
.seg .grp{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;background:var(--sheet)}
.seg button{cursor:pointer;height:32px;min-width:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-size:13px;
  display:inline-flex;align-items:center;gap:5px;transition:background-color .2s,color .2s}
.seg button:hover{background:var(--hair);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--moss-d);color:var(--sheet)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;height:36px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink2);font-size:13px;transition:border-color .2s,color .2s}
.sw:hover{border-color:var(--moss);color:var(--ink)}
.sw .ic{color:var(--moss)}
.sw .trk{width:30px;height:17px;border-radius:9px;background:var(--hair);border:1px solid var(--line);position:relative;transition:background-color .3s}
.sw .trk::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--muted);transition:transform .35s cubic-bezier(.3,1.4,.5,1),background-color .3s}
.sw[aria-pressed="true"] .trk{background:var(--moss)}
.sw[aria-pressed="true"] .trk::after{transform:translateX(13px);background:var(--sheet)}

/* ===== 題目面板 ===== */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,2.6vw,34px);min-width:0;
  transition:background-color .4s,border-color .4s}
.p-head{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between;align-items:flex-start}
.p-head .ttl{flex:1 1 30rem;min-width:0}
.panel h2{margin:0;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-weight:700;font-size:1.34rem;line-height:1.45;letter-spacing:.03em;text-wrap:balance}
.q{margin:8px 0 0;color:var(--ink2);font-size:.9rem;max-width:46em;line-height:1.8}
.q .lab{color:var(--moss);font-size:.76rem;letter-spacing:.03em;margin-right:.5em;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--ink2);flex-wrap:wrap}
.prog .ring{width:34px;height:34px}
.prog .ring .arc{stroke:var(--ripe)}
.prog b{font-family:"Noto Serif TC",serif;font-weight:600;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.reset{display:inline-flex;align-items:center;gap:5px;cursor:pointer;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:12px;transition:color .2s,border-color .2s}
.reset:hover{color:var(--ink);border-color:var(--bark-l)}
.reset.arm{color:var(--ripe);border-color:var(--ripe)}
.rule{height:1px;background:var(--hair);margin:20px 0 8px}
.tip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:14px 0 0;font-size:.78rem;color:var(--muted)}
.tip span{display:inline-flex;align-items:center;gap:5px}
.tip .ic{width:15px;height:15px;color:var(--moss)}

/* ===== 樹狀圖：森林 ===== */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.grove{position:relative;display:grid;grid-template-columns:minmax(15rem,1fr) 6.5rem minmax(15rem,1fr);min-width:40rem;padding:1.3rem .4rem 0}
/* 窄框：樹幹靠左、所有枝都長在右邊，不需要橫向捲動 */
.grove.narrow{grid-template-columns:3.4rem minmax(0,1fr);min-width:0}
.narrow .col-t{grid-column:1}
.narrow .col-r{grid-column:2;padding-top:1rem}
.narrow .bough.side-r{--gap:clamp(.7rem,3vw,3rem)}
.narrow .side-r .leaves>.in{padding-left:2rem}
.narrow .base{justify-content:flex-start;padding-left:.2rem}
.wood{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.wood .bf{fill:var(--bark);transition:fill .35s}
.wood .bl{fill:none;stroke:var(--bark-d);stroke-width:1.1;stroke-linecap:round;opacity:.6}
.wood .bh{fill:none;stroke:var(--bark-l);stroke-width:1;stroke-linecap:round;stroke-dasharray:18 9 6 11;opacity:.7}
.wood .twig{fill:none;stroke:var(--bark);stroke-width:1.7;stroke-linecap:round;transition:stroke .35s}
.wood .dleaf{fill:var(--sprout)}
.wood .dvein{fill:none;stroke:var(--moss-d);stroke-width:.6;opacity:.6}
.wood .gline{fill:none;stroke:var(--ground);stroke-width:2.4;stroke-linecap:round}
.wood .blades{fill:none;stroke:var(--grass);stroke-width:1.4;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%}
.wood .pebble{fill:var(--ground)}
.limb{transition:opacity .35s ease}
.limb.hot .bf{fill:var(--bark-lit)}
.limb.hot .twig{stroke:var(--bark-lit)}
.limb.hot{filter:var(--hotfx)}
.grove[data-hot] .limb:not(.hot),.grove[data-hot] .bough:not(.hot){opacity:.26}

.col{display:flex;flex-direction:column;gap:2.4rem;position:relative;z-index:1;padding-bottom:3rem}
.col-l{grid-column:1;align-items:flex-end;padding-top:5.6rem}
.col-t{grid-column:2}
.col-r{grid-column:3;align-items:flex-start;padding-top:1.4rem}
.base{grid-column:1 / -1;position:relative;z-index:1;display:flex;justify-content:center;padding:3rem 0 .4rem}
.plaque{position:relative;background:var(--plaque);color:var(--plaque-ink);border-radius:9px 12px 8px 11px;padding:.7rem 1.4rem .8rem;text-align:center;max-width:24rem;transition:background-color .4s}
.plaque::before,.plaque::after{content:"";position:absolute;top:.55rem;width:5px;height:5px;border-radius:50%;background:var(--bark-d)}
.plaque::before{left:.6rem}.plaque::after{right:.6rem}
.plaque .k{display:block;font-size:.7rem;letter-spacing:.3em;opacity:.8}
.plaque .t{display:block;font-family:"LXGW WenKai TC",serif;font-weight:700;font-size:1.1rem;line-height:1.45;letter-spacing:.03em}
.carve{position:absolute;z-index:1;writing-mode:vertical-rl;font-family:"LXGW WenKai TC",serif;font-weight:700;font-size:.8rem;letter-spacing:.35em;color:var(--bark-d);pointer-events:none;opacity:.9;line-height:1}

.bough{--gap:clamp(1rem,3.4vw,4.8rem);position:relative;display:flex;flex-direction:column;width:min(calc(100% - var(--gap) - .7rem),31rem);transition:opacity .35s ease}
.bough.side-r{margin-left:var(--gap);align-items:flex-start}
.bough.side-l{margin-right:var(--gap);align-items:flex-end}
.limb-lab{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.1rem .5rem;padding:.15rem .3rem .7rem;background:none;border:0;cursor:pointer;color:var(--ink);text-align:left;max-width:100%;border-radius:6px}
.side-l .limb-lab{flex-direction:row-reverse;text-align:right}
.num{font-family:"Noto Serif TC",serif;font-weight:600;font-size:.78rem;color:var(--moss);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.limb-lab .name,.l-head .name{font-family:"LXGW WenKai TC",serif;font-weight:700;font-size:1.06rem;line-height:1.4;letter-spacing:.02em}
.cnt{font-size:.72rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bud{width:15px;height:15px;color:var(--moss);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.closed .bud{transform:rotate(-90deg) scale(.85)}
.side-l.closed .bud{transform:rotate(90deg) scale(.85)}
.limb-lab:hover .name,.l-head:hover .name{color:var(--moss-d)}

.leaves{display:grid;grid-template-rows:1fr;width:100%;transition:grid-template-rows .42s cubic-bezier(.3,.7,.2,1)}
.closed .leaves{grid-template-rows:0fr}
.leaves>.in{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.5rem;padding:.7rem .7rem .6rem;margin:-.7rem -.7rem -.15rem}/* 上下左右留白讓已背葉片的花、果實不被裁掉 */
.side-r .leaves>.in{padding-left:2.7rem;align-items:flex-start}
.side-l .leaves>.in{padding-right:2.7rem;align-items:flex-end}

.leaf{--s:1;position:relative;display:block;width:fit-content;max-width:100%;text-align:left;cursor:pointer;font-size:.9rem;line-height:1.62;color:var(--ink);
  background:var(--lf);border:1px solid var(--le);padding:.5rem 1rem .52rem;border-radius:.35em 1.3em .35em 1.3em;transform-origin:0 50%;
  transition:background-color .35s,border-color .2s,transform .4s cubic-bezier(.3,1.3,.5,1),opacity .3s,box-shadow .2s;transition-delay:0s,0s,calc(var(--j,0)*40ms),calc(var(--j,0)*40ms),0s}
/* 接細枝的那一角（右側枝＝左上、左側枝＝右上）用小圓角，細枝才會接在平直的邊上；對角才是大圓角 */
.side-l .leaf{--s:-1;border-radius:1.3em .35em 1.3em .35em;transform-origin:100% 50%}
/* 滑過：葉片外框（命中範圍）不動，只讓裡面的字輕輕往外挪＋邊框變深，避免滑鼠在邊緣來回進出而抖 */
.leaf .txt{display:block;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
@media (hover:hover){
  .leaf:hover .txt{transform:translateX(calc(var(--s)*2px))}
}
.closed .leaf{opacity:0;transform:scale(.25) rotate(calc(var(--s)*-24deg))}
.leaf strong{font-weight:700}
.leaf .sep{color:var(--moss)}
.leaf .txt .ic{color:var(--moss);width:1em;height:1em;vertical-align:-.12em;margin:0 .1em}
/* 背過了：秋葉金（漸層底＋加粗飽和描邊＋柔光），不只靠顏色——左上葉柄開花、右下結一顆打勾小果實 */
.leaf.done{background:linear-gradient(135deg,var(--gold-a),var(--gold-b));border-color:var(--gold-e);
  box-shadow:inset 0 0 0 1.5px var(--gold-e),0 2px 10px -2px var(--gold-glow)}
.leaf.done .sep,.leaf.done .txt .ic{color:var(--gold-ink)}
.leaf.done strong{color:var(--gold-ink)}
/* 滑過／Tab 聚焦：只用 inset 粗框＋外光暈＋底色變亮，卡片尺寸與位置完全不變（不會抽搐） */
@media (hover:hover){
  .leaf:hover{border-color:var(--moss-d);background-color:color-mix(in srgb,var(--lf),var(--lift) var(--liftp));
    box-shadow:inset 0 0 0 2px var(--moss-d),0 0 0 4px var(--halo)}
  .leaf.done:hover{border-color:var(--gold-ink);box-shadow:inset 0 0 0 2.5px var(--gold-ink),0 0 0 4px var(--gold-glow),0 4px 16px -2px var(--gold-glow)}
  .recite .leaf:not(.open):hover .cover{filter:brightness(1.15)}
}
.leaf:focus-visible{border-color:var(--moss-d);background-color:color-mix(in srgb,var(--lf),var(--lift) var(--liftp));
  box-shadow:inset 0 0 0 2px var(--moss-d),0 0 0 4px var(--halo)}
.leaf.done:focus-visible{border-color:var(--gold-ink);box-shadow:inset 0 0 0 2.5px var(--gold-ink),0 0 0 4px var(--gold-glow),0 4px 16px -2px var(--gold-glow)}

  dleaf(trunkG, "cl2", Tt.x, Tt.y + 2, -90 + 12, growing, 1.05, 1.15);
  /* 地面與草 */
  const groundG = svg.querySelector(".ground");
  upsert(groundG, "gl", "path", { class:"gline", d:`M0,${f1(gy + 5)} C${f1(W * .2)},${f1(gy - 3)} ${f1(W * .35)},${f1(gy + 7)} ${f1(W * .5)},${f1(gy + 3)} S${f1(W * .8)},${f1(gy - 2)} ${f1(W)},${f1(gy + 6)}` });
  [cx - 168, cx - 98, cx + 92, cx + 160, W * .1, W * .27, W * .72, W * .9].map(x => Math.min(Math.max(x, 10), W - 10)).forEach((x, k) => {
    const [tg, created] = upsert(groundG, "tuft" + k, "g", { transform:`translate(${f1(x)},${f1(gy + 4)})` });
    if (created) mk("path", { class:"blades", d:"M0 0q-2-7-5-11M0 0q0-8 1-13M0 0q2-6 6-9", style:`animation-delay:${(-k * .6).toFixed(1)}s` }, tg);
  });
  [[cx - 58, 3.2], [cx + 112, 2.4], [W * .2, 2.6], [W * .8, 3]].forEach(([x, r], k) => upsert(groundG, "pb" + k, "ellipse", { class:"pebble", cx:f1(Math.min(Math.max(x, 8), W - 8)), cy:f1(gy + 6), rx:r * 1.6, ry:r }));
  const atY = y => nearestY(tp, y);

  /* 樹枝 */
  g.querySelectorAll(".bough").forEach(b => {
    const i = +b.dataset.i, s = b.classList.contains("side-l") ? -1 : 1;
    const lg = svg.querySelector(`.limb[data-i="${i}"]`);
    const lab = b.querySelector(".limb-lab"), Lb = pos(lab, g), Bp = pos(b, g);
    const xin = s > 0 ? Lb.x : Lb.x + Lb.w;
    const F = { x:xin + s * 8, y:Lb.y + Lb.h - 6 };
    const Tp = { x:Math.min(Math.max(xin + s * (Lb.w + 18), 22), W - 22), y:F.y - 8 };
    const sy = Math.min(Math.max(F.y + 52, yTop + 44), gy - 84);
    const tq = atY(sy);
    const S = { x:tq.x + s * (tq.w / 2 - 5), y:sy };
    const dx = F.x - S.x, ws = Math.min(19, tq.w * .64);
    const segs = [
      { p:[S, { x:S.x + dx * .38, y:S.y - 4 }, { x:F.x - dx * .42, y:F.y + 16 }, F], w0:ws, w1:7 },
      { p:[F, { x:F.x + (Tp.x - F.x) * .35, y:F.y + 1.5 }, { x:Tp.x - (Tp.x - F.x) * .3, y:Tp.y + 5 }, Tp], w0:7, w1:.8 }
    ];
    const d0 = LD(i);
    const mp = piece(g, lg, "main", segs, { seed:11 + i * 7, n:24, lines:[[.18,"10 5 3 6"],[-.2,"14 6"]], hi:-.36, grow:growing, delay:d0, dur:.8, mw:32 });
    const k1 = Math.floor(mp.length * .26), p1 = mp[k1];
    dleaf(lg, "dl0", p1.x + p1.nx * -s * 0, p1.y - p1.w * .3, angAt(mp, k1) - s * 58, growing, d0 + .45, .9);
    const kE = mp.length - 1;
    dleaf(lg, "dl1", Tp.x, Tp.y, angAt(mp, kE) - s * 26, growing, d0 + .8, 1);
    dleaf(lg, "dl2", Tp.x - s * 6, Tp.y + 1, angAt(mp, kE) + s * 30, growing, d0 + .85, .8);

    /* 分岔的小枝＋細枝連到葉子 */
    const open = !b.classList.contains("closed");
    const regrow = g._regrow.has(i);
    if (open) {
      const inBox = pos(b.querySelector(".in"), g);
      const mids = [...b.querySelectorAll(".leaf")].map(lf => { const r = pos(lf, g); return { r, y:r.y + Math.min(r.h / 2, 20), xe:s > 0 ? r.x : r.x + r.w }; })
        .filter(m => m.r.y < inBox.y + inBox.h - 6);
      if (mids.length) {
        const yl = mids[mids.length - 1].y, E = { x:F.x + s * 6, y:yl - 8 };
        let sp = null;
        if (E.y - F.y > 16) {
          sp = piece(g, lg, "stem", [{ p:[F, { x:F.x - s * 3, y:F.y + (E.y - F.y) * .35 }, { x:E.x + s * 5, y:E.y - (E.y - F.y) * .3 }, E], w0:5.5, w1:1.3 }],
            { seed:60 + i, n:20, lines:[[0,"6 5"]], minw:4, grow:growing, delay:d0 + .55, dur:.5, mw:12 });
          dleaf(lg, "dl3", E.x, E.y, 90 - s * 40, growing, d0 + 1.05, .75);
        }
        mids.forEach((m, j) => {
          const p0 = sp ? nearestY(sp, m.y - 13) : F;
          twig(lg, "tw" + j, { x:p0.x, y:p0.y }, { x:m.xe - s, y:m.y }, growing || regrow, growing ? d0 + .8 + j * .1 : .12 + j * .06);
        });
      }
    }
    /* 搖曳支點＝樹枝接樹幹的位置（SVG 與 HTML 同一點，才不會脫節） */
    lg.style.transformOrigin = `${f1(S.x)}px ${f1(S.y)}px`;
    b.style.transformOrigin = `${f1(S.x - Bp.x)}px ${f1(S.y - Bp.y)}px`;
  });
  svg.querySelectorAll("[data-key]").forEach(e => { if (!e.dataset.live) e.remove(); });

  /* 樹幹上的刻字 */
  const cv = g.querySelector(".carve"), cy = yTop + Hh * .58, cp = atY(cy);
  cv.style.left = f1(cp.x - cv.offsetWidth / 2) + "px";
  cv.style.top = f1(cy - cv.offsetHeight / 2) + "px";
  cv.hidden = cp.w < 22;
}
function finishGrow(g){
  g.classList.remove("grow");
  g.querySelectorAll(".wood [mask]").forEach(e => { e.removeAttribute("mask"); e._mp = null; });
  g.querySelector(".wood defs").innerHTML = "";
  if (!reduce.matches) g.classList.add("breeze");
}

/* ---------- 清單 ---------- */
function listView(qi){
  const t = T[qi];
  const box = document.createElement("div");
  box.className = "list" + (reduce.matches ? "" : " grow");
  box.innerHTML = `<div class="l-root"><span class="k">申論題${t.k}</span><span class="t">${esc(t.title)}</span></div>` + t.b.map(([name, leaves], i) =>
    `<section class="l-sec side-r" data-i="${i}" style="${leafVars(i)}">
      <button type="button" class="l-head" aria-expanded="true" aria-controls="ls${i}"><span class="num">${pad2(i + 1)}</span><span class="name">${esc(name)}</span><span class="cnt"><b class="ct" data-to="${leaves.length}">0</b> 片葉</span>${ICON.bud}</button>
      <div class="leaves" id="ls${i}"><div class="in">${leaves.map((s, j) => leafBtn(qi, i, j, s, .1 + i * .12 + j * .07)).join("")}</div></div>
    </section>`).join("");
  return box;
}

/* ---------- 顯示模式 ---------- */
let view = store.get("E-forest-view");
const curView = () => view || (window.matchMedia("(max-width: 760px)").matches ? "list" : "tree");
function modeBtns(){
  const b = document.getElementById("mode");
  b.innerHTML = `<span class="t">${ICON.sprout}<span>顯示</span></span><span class="grp">` + [["tree","樹狀圖",ICON.tree],["list","清單",ICON.list]].map(([k, n, ic]) =>
    `<button type="button" data-v="${k}" aria-pressed="${curView() === k}">${ic}${n}</button>`).join("") + `</span>`;
  b.querySelectorAll("button").forEach(x => x.onclick = () => { view = x.dataset.v; store.set("E-forest-view", view); modeBtns(); show(cur); });
}

/* ---------- 背誦模式 ---------- */
const panel = document.getElementById("panel");
const reciteBtn = document.getElementById("recite");
let recite = store.get("E-forest-recite") === "1";
function applyRecite(){
  reciteBtn.setAttribute("aria-pressed", String(recite));
  reciteBtn.innerHTML = `${ICON.leaf}<span>背誦模式</span><i class="trk" aria-hidden="true"></i>`;
  panel.classList.toggle("recite", recite);
  panel.querySelectorAll(".leaf.open").forEach(l => l.classList.remove("open"));
  const tip = panel.querySelector(".tip .tp-leaf");
  if (tip) tip.innerHTML = tipLeaf();
}
const tipLeaf = () => recite ? `${ICON.tap}點葉子翻開，再點一次標成「背過了」；已背的再點一次可取消` : `${ICON.tap}點葉子標成「背過了」（轉成秋葉金、開花、結一顆打勾果實）；已背的再點一次可取消`;
reciteBtn.onclick = () => { recite = !recite; store.set("E-forest-recite", recite ? "1" : "0"); applyRecite(); };

/* ---------- 進度 ---------- */
function updateProgress(qi, replay){
  const n = doneIn(qi), N = total(qi);
  const pn = panel.querySelector(".pn");
  if (pn) { countUp(pn, n, replay ? 0 : +pn.textContent || 0, replay ? 1100 : 450); ringTo(panel.querySelector(".prog .arc"), n / N * 100, replay); }
  tabs.children[qi].querySelector(".pg").textContent = `${doneIn(qi)}/${N}`;
  tabs.children[qi].classList.toggle("all", n === N);
}

/* ---------- 題目分頁 ---------- */
let cur = 0;
function show(i){
  cur = i;
  [...tabs.children].forEach((b, k) => { b.setAttribute("aria-selected", String(k === i)); b.tabIndex = k === i ? 0 : -1; });
  store.set("E-forest-tab", String(i));
  const tb = tabs.children[i];
  if (tabs.scrollWidth > tabs.clientWidth) tabs.scrollTo({ left:Math.max(0, tb.offsetLeft - tabs.offsetLeft - (tabs.clientWidth - tb.offsetWidth) / 2), behavior:reduce.matches ? "auto" : "smooth" });
  const t = T[i];
  if (ro) { ro.disconnect(); ro = null; }
  clearTimeout(growTimer);
  panel.innerHTML = `<div class="p-head"><div class="ttl"><h2>申論題${t.k}｜${esc(t.title)}</h2><p class="q"><span class="lab">題目要點</span>${esc(t.q)}</p></div>
    <div class="prog">${RING()}<span>已背過 <b class="pn">0</b>／${total(i)} 片葉</span><button type="button" class="reset" id="reset">${ICON.wind}<span>清空本題</span></button></div></div>
    <div class="rule"></div><div id="sc"></div>`;
  const sc = document.getElementById("sc");
  if (curView() === "list") {
    sc.appendChild(listView(i));
    sc.insertAdjacentHTML("afterend", `<p class="tip"><span>${ICON.bud}點枝名可收合／展開</span><span class="tp-leaf">${tipLeaf()}</span></p>`);
    const lst = sc.firstChild;
    if (lst.classList.contains("grow")) growTimer = setTimeout(() => lst.classList.remove("grow"), 1900);
  } else {
    sc.className = "scroll";
    const g = treeView(i, isNarrow(sc));
    sc.appendChild(g);
    sc.insertAdjacentHTML("afterend", `<p class="tip"><span>${ICON.swipe}框太窄時樹會改成單側生長</span><span>${ICON.bud}點枝名可收合</span><span class="tp-leaf">${tipLeaf()}</span><span>${ICON.leaf}滑過枝條會亮起</span></p>`);
    wire(g);
    let raf = 0;
    const req = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; wire(g); }); };
    ro = new ResizeObserver(req);
    ro.observe(g);
    g.querySelectorAll(".bough,.limb-lab").forEach(e => ro.observe(e));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(req);
    if (g.classList.contains("grow")) growTimer = setTimeout(() => finishGrow(g), GROW_END(t.b.length) * 1000);
  }
  panel.querySelectorAll(".ct").forEach((c, k) => countUp(c, +c.dataset.to, 0, 900 + k * 120));
  updateProgress(i, true);
  playGrade();
}

/* 框寬不夠放雙側樹（40rem）就改單側；跨過門檻時重畫 */
function isNarrow(sc){ return sc.clientWidth < 40 * (parseFloat(getComputedStyle(document.documentElement).fontSize) || 19); }
function relayout(){
  const sc = document.getElementById("sc"), g = sc && sc.querySelector(".grove");
  if (g && isNarrow(sc) !== g.classList.contains("narrow")) show(cur);
}
let rzT = 0;
window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(relayout, 150); });

/* 切換一片葉子的「背過了」外觀。
   舊版 bug：取消時只拿掉 .done，但 .pop 動畫是 fill-mode:both，會把花和果實「鎖」在放大後的樣子，所以看起來還有花花跟勾勾。
   現在取消時一定先拿掉 .pop，再播反向的 .wilt（凋謝）動畫，播完自動清掉。 */
const DONE_TIP = "已背過了｜再點一次取消";
function setLeaf(lf, on){
  clearTimeout(lf._wt);
  lf.classList.remove("pop", "wilt");
  lf.classList.toggle("done", on);
  lf.setAttribute("aria-pressed", String(on));
  if (on) lf.title = DONE_TIP; else lf.removeAttribute("title");
  if (reduce.matches) return;
  void lf.offsetWidth;
  lf.classList.add(on ? "pop" : "wilt");
  if (!on) lf._wt = setTimeout(() => lf.classList.remove("wilt"), 900);
}

/* 點擊：葉子（背過了／翻開）、枝名（收合）、清空 */
panel.addEventListener("click", e => {
  const lf = e.target.closest(".leaf");
  if (lf) {
    if (recite && !lf.classList.contains("open")) { lf.classList.add("open"); return; }
    const key = lf.dataset.key, on = !done.has(key);
    on ? done.add(key) : done.delete(key);
    saveDone();
    setLeaf(lf, on);
    updateProgress(cur, false);
    return;
  }
  const hd = e.target.closest(".limb-lab,.l-head");
  if (hd) {
    const sec = hd.closest(".bough,.l-sec"), open = hd.getAttribute("aria-expanded") !== "true";
    hd.setAttribute("aria-expanded", String(open));
    sec.classList.toggle("closed", !open);
    sec.querySelector(".leaves").inert = !open;
    const g = sec.closest(".grove");
    if (g && open && !reduce.matches) { const i = +sec.dataset.i; g._regrow.add(i); setTimeout(() => g._regrow.delete(i), 700); }
    return;
  }
  const rs = e.target.closest("#reset");
  if (rs) {
    if (!rs.classList.contains("arm")) {
      rs.classList.add("arm"); rs.querySelector("span").textContent = "再點一次確認";
      setTimeout(() => { if (rs.isConnected) { rs.classList.remove("arm"); rs.querySelector("span").textContent = "清空本題"; } }, 3000);
      return;
    }
    [...done].filter(k => k.startsWith(cur + "-")).forEach(k => done.delete(k));
    saveDone();
    panel.querySelectorAll(".leaf.done").forEach(l => setLeaf(l, false));
    rs.classList.remove("arm"); rs.querySelector("span").textContent = "清空本題";
    updateProgress(cur, false);
  }
});

const tabs = document.getElementById("tabs");
T.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-controls", "panel");
  b.innerHTML = `${ICON.leaf}<span class="n">${t.k}</span><span>${esc(shortName(t))}</span><span class="pg">0/${total(i)}</span>`;
  b.onclick = () => show(i);
  b.onkeydown = e => {
    const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    const k = (i + d + T.length) % T.length; show(k); tabs.children[k].focus();
  };
  tabs.appendChild(b);
  b.querySelector(".pg").textContent = `${doneIn(i)}/${total(i)}`;
  b.classList.toggle("all", doneIn(i) === total(i));
});

/* ---------- 字體大小 ---------- */
(function(){
  const SIZES = [["小",16],["中",19],["大",22],["特大",25]];
  let px = +(store.get("E-forest-font") || 19) || 19;
  const box = document.getElementById("fsz");
  box.innerHTML = `<span class="t">${ICON.sprout}<span>字體</span></span><span class="grp">` + SIZES.map(([n, v]) => `<button type="button" data-px="${v}">${n}</button>`).join("") + `</span>`;
  function apply(v){
    px = v; document.documentElement.style.fontSize = v + "px";
    store.set("E-forest-font", String(v));
    box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.px === v)));
    if (document.getElementById("sc")) relayout();
  }
  box.querySelectorAll("button").forEach(b => b.onclick = () => apply(+b.dataset.px));
  apply(px);
})();

/* ---------- 淺色／深色 ---------- */
(function(){
  const btn = document.getElementById("theme");
  const MODES = { system:["sys","跟隨系統"], light:["sun","淺色"], dark:["moon","深色"] };
  const ORDER = ["system","light","dark"];
  let mode = store.get("E-forest-theme") || "system";
  if (!MODES[mode]) mode = "system";
  function apply(){
    if (mode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    const [ic, lb] = MODES[mode];
    btn.innerHTML = ICON[ic] + `<span class="lbl">${lb}</span>`;
    btn.setAttribute("aria-label", `配色：${lb}（點一下切換）`);
    btn.title = `配色：${lb}`;
  }
  btn.onclick = () => { mode = ORDER[(ORDER.indexOf(mode) + 1) % ORDER.length]; store.set("E-forest-theme", mode); apply(); btn.querySelector(".ic").classList.add("enter"); };
  apply();
})();

/* 圖示點擊時：外框彈一下（tapfx）＋圖示自己的小動畫播一次（play） */
function replay(el, cls, ms){
  el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls);
  clearTimeout(el["_t" + cls]); el["_t" + cls] = setTimeout(() => el.classList.remove(cls, "enter"), ms);
}
document.addEventListener("click", e => {
  if (reduce.matches) return;
  const host = e.target.closest(".seg,button,.tip span,.head h1,.outline h3");
  if (!host) return;
  const btn = e.target.closest("button");
  const ic = btn && btn.querySelector(".ic:not(.bud)");
  if (ic) replay(ic, "tapfx", 480);
  (btn || host).querySelectorAll(".ic").forEach(x => replay(x, "play", 1300));
  const seg = e.target.closest(".seg");
  if (seg) { const sp = seg.querySelector(".t .ic"); if (sp) replay(sp, "play", 1300); }
});

document.getElementById("h1ic").outerHTML = ICON.sprout;
document.getElementById("olic").outerHTML = ICON.flower;
modeBtns();
applyRecite();
let start = +(store.get("E-forest-tab") || 0) || 0;
show(Math.min(Math.max(start, 0), T.length - 1));
</script>

/* 花苞（收合提示、片數旁）：亮一下＋晃 */
.bud>g{transform-origin:50% 100%!important}
.limb-lab:hover .bud>g,.l-head:hover .bud>g,.tip span:hover .bud>g,.bud.play>g{animation:budglow .9s ease-in-out}
@keyframes budglow{0%,100%{transform:none;fill:currentColor;fill-opacity:0}30%{transform:scale(1.22) rotate(-12deg);fill:currentColor;fill-opacity:.55}62%{transform:rotate(9deg);fill:currentColor;fill-opacity:.3}}
.ic.play .i-tap{animation:tapdn .6s ease-in-out}
.ic.play .i-swipe{animation:swipe 1s ease-in-out}
.ic.play .i-flower{animation:bloomspin .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes bloomspin{50%{transform:rotate(72deg) scale(1.15)}}
.ic.play .i-crown{animation:rustle .9s ease-in-out}
.ic.play .i-rays{animation:spin 1.2s ease-out}
.ic.play .i-w1,.ic.play .i-w2,.ic.play .i-w3{animation:gust .8s ease-in-out}
button:hover .i-w1,button:hover .i-w2,button:hover .i-w3{animation:gust .8s ease-in-out}
.i-w2{animation-delay:.08s!important}.i-w3{animation-delay:.16s!important}
@keyframes gust{40%{transform:translateX(3px)}}
.outline h3:hover .i-flower{transform:rotate(72deg) scale(1.1)}
.tip span:hover .i-tap{animation:tapdn .6s ease-in-out}
@keyframes tapdn{40%{transform:translateY(2px) scale(.94)}}
.tip span:hover .i-swipe{animation:swipe 1s ease-in-out}
@keyframes swipe{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.ic.tapfx{animation:tapfx .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tapfx{35%{transform:scale(.78) rotate(-8deg)}}
.theme .ic.enter{animation:enter .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes enter{from{transform:scale(.3) rotate(-120deg);opacity:0}}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>

<div id="stsw-host"></div>
<script>
(function(){
  try { localStorage.setItem("essay-map-style", "e"); } catch(e) {}
  const host = document.getElementById("stsw-host");
  const root = host.attachShadow({mode: "open"});
  root.innerHTML = `<style>
    :host{all:initial}
    .wrap{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483000;font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
    button{font:inherit;cursor:pointer;border:1px solid rgba(0,0,0,.15);background:#fff;color:#333;border-radius:999px;padding:7px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
    button:focus-visible,a:focus-visible{outline:2px solid #3570A3;outline-offset:2px}
    .panel{position:absolute;left:0;bottom:46px;background:#fff;color:#333;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.22);padding:8px;display:flex;flex-direction:column;gap:2px;min-width:170px}
    .panel[hidden]{display:none}
    .panel b{font-size:12px;color:#777;padding:2px 8px;font-weight:500}
    a{display:flex;gap:10px;align-items:center;text-decoration:none;color:#333;padding:7px 10px;border-radius:9px}
    a:hover{background:#f1efe9}
    a[aria-current]{background:#ebe6dc;font-weight:700}
    i{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
  </style>
  <div class="wrap"><div class="panel" hidden><b>選一種風格（會記住）</b><a href="essay-map-a.html" data-k="a" ><i style="background:#8A9E92"></i>精緻莫蘭迪</a><a href="essay-map-b.html" data-k="b" ><i style="background:#F0A6A0"></i>可愛手帳</a><a href="essay-map-c.html" data-k="c" ><i style="background:#2BD97F"></i>晶片科技</a><a href="essay-map-d.html" data-k="d" ><i style="background:#C0392B"></i>雜誌編排</a><a href="essay-map-e.html" data-k="e" aria-current="page"><i style="background:#5E8C4A"></i>森林樹枝</a></div><button type="button" aria-expanded="false">🎨 換風格</button></div>`;
  const btn = root.querySelector("button"), panel = root.querySelector(".panel");
  btn.onclick = () => { panel.hidden = !panel.hidden; btn.setAttribute("aria-expanded", String(!panel.hidden)); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); } });
})();
</script>
</body>
</html>
