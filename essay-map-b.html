<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>申論題手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* ===== 色票：淺色＝白天的書桌 ===== */
:root{
  color-scheme:light;
  --desk:#E9DFCC; --paper:#FFFCF5; --card:#FFFEFA;
  --grid:rgba(110,150,175,.16); --margin:#F0A6A0; --hole:#E9DFCC;
  --ink:#3B3631; --ink-soft:#6E655B; --muted:#7A6F63;
  --sticky:#FFEB99; --sticky-ink:#4A3F1E;
  --hl:#FFE36B; --tape-ink:#3B3631; --stripe:rgba(255,255,255,.5);
  --shadow-hard:rgba(80,60,30,.16);
  --a-tape:#BFE6CF; --a-ink:#2F7D5B; --a-hl:#C6F0D8;
  --b-tape:#FFCDB8; --b-ink:#C0573D; --b-hl:#FFD9C9;
  --c-tape:#C5DEF2; --c-ink:#3570A3; --c-hl:#CFE6F8;
  --d-tape:#FBE7A1; --d-ink:#9A7A12; --d-hl:#FFF0A0;
  --e-tape:#DDD3F0; --e-ink:#6D58A0; --e-hl:#E6DDF6;
  --f-tape:#F6CFE0; --f-ink:#B04A7A; --f-hl:#F9DAE7;
  --chip:#BFE6CF; --chip-ink:#2F5D48; --cheek:#F6A9A0;
}
/* ===== 深色＝夜燈下的筆記本 ===== */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#191816; --paper:#24221F; --card:#2B2925;
    --grid:rgba(230,220,200,.07); --margin:#8A4E4A; --hole:#191816;
    --ink:#EDE6DA; --ink-soft:#C4BAAC; --muted:#A99F92;
    --sticky:#4B4126; --sticky-ink:#F5E9C4;
    --hl:rgba(255,214,80,.32); --tape-ink:#F2ECE2; --stripe:rgba(255,255,255,.08);
    --shadow-hard:rgba(0,0,0,.45);
    --a-tape:#2E5A48; --a-ink:#8FD6B2; --a-hl:rgba(120,220,170,.25);
    --b-tape:#6A3A2C; --b-ink:#F4A88F; --b-hl:rgba(255,150,120,.25);
    --c-tape:#2C4A66; --c-ink:#9CC6EC; --c-hl:rgba(120,180,240,.25);
    --d-tape:#5E4E1A; --d-ink:#E8CF6E; --d-hl:rgba(240,210,100,.25);
    --e-tape:#463B5E; --e-ink:#C2B2E8; --e-hl:rgba(190,170,240,.25);
    --f-tape:#5C3248; --f-ink:#EFA6C6; --f-hl:rgba(240,160,200,.25);
    --chip:#2E5A48; --chip-ink:#CFF0DF; --cheek:#C9756C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#191816; --paper:#24221F; --card:#2B2925;
  --grid:rgba(230,220,200,.07); --margin:#8A4E4A; --hole:#191816;
  --ink:#EDE6DA; --ink-soft:#C4BAAC; --muted:#A99F92;
  --sticky:#4B4126; --sticky-ink:#F5E9C4;
  --hl:rgba(255,214,80,.32); --tape-ink:#F2ECE2; --stripe:rgba(255,255,255,.08);
  --shadow-hard:rgba(0,0,0,.45);
  --a-tape:#2E5A48; --a-ink:#8FD6B2; --a-hl:rgba(120,220,170,.25);
  --b-tape:#6A3A2C; --b-ink:#F4A88F; --b-hl:rgba(255,150,120,.25);
  --c-tape:#2C4A66; --c-ink:#9CC6EC; --c-hl:rgba(120,180,240,.25);
  --d-tape:#5E4E1A; --d-ink:#E8CF6E; --d-hl:rgba(240,210,100,.25);
  --e-tape:#463B5E; --e-ink:#C2B2E8; --e-hl:rgba(190,170,240,.25);
  --f-tape:#5C3248; --f-ink:#EFA6C6; --f-hl:rgba(240,160,200,.25);
  --chip:#2E5A48; --chip-ink:#CFF0DF; --cheek:#C9756C;
}

/* ===== 基礎 ===== */
*{box-sizing:border-box}
html{font-size:19px}
body{
  margin:0; background:var(--desk); color:var(--ink);
  font-family:"LXGW WenKai TC","Huninn","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:1rem; line-height:1.75; overflow-x:clip;
}
.hand-title,h1,h2,h3,button,.tape-label{font-family:"Huninn","LXGW WenKai TC","PingFang TC",sans-serif}
/* 寬度隨視窗流動，大螢幕上限 1600px */
.desk{width:100%;max-width:1600px;margin:0 auto;padding:32px clamp(16px,3vw,40px) 56px}

/* ===== 手繪感外框（不規則圓角） ===== */
.rough{border-radius:255px 14px 225px 14px / 14px 225px 14px 255px}

/* ===== 紙膠帶 ===== */
.tape{
  --t:var(--d-tape);
  display:inline-block; padding:2px 16px; color:var(--tape-ink);
  background-color:var(--t);
  background-image:repeating-linear-gradient(45deg,var(--stripe) 0 4px,transparent 4px 10px);
  clip-path:polygon(0 0,100% 0,calc(100% - 5px) 25%,100% 50%,calc(100% - 5px) 75%,100% 100%,0 100%,5px 75%,0 50%,5px 25%);
}

/* 手機觸控：不閃藍色點擊框、不等雙擊縮放（點下去就反應，不抖） */
.tab,.btn,.br-btn,.list li.leaf,.tree .br,.tree .leaf,.mascot-btn,.outline .star{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ===== 索引分頁 ===== */
.tabs{
  display:flex; gap:6px; padding:0 18px 0 76px; margin:0;
  overflow-x:auto; scrollbar-width:thin; position:relative; z-index:2;
}
.tab{
  flex:none; cursor:pointer; border:0; font-size:.82rem; color:var(--tape-ink); white-space:nowrap;
  padding:8px 14px 6px; margin-top:8px; border-radius:12px 12px 0 0;
  background:var(--t); opacity:.85; line-height:1.3;
  transition:margin-top .18s ease, opacity .18s ease;
}
/* 防抽搐：頁籤本身不旋轉／位移；上提用 margin-top（下緣固定、只往上長，滑鼠不會掉出邊界），微歪只轉裡面的字 */
.tab:hover{margin-top:3px;opacity:1}
.tab .tab-in{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top;transition:transform .18s ease}
.tab:hover .tab-in{transform:rotate(-2deg) translateY(-1px)}
.tab[aria-selected="true"] .tab-in{transform:none}
.tab[aria-selected="true"]{margin-top:0;padding-bottom:12px;opacity:1;background:var(--paper);color:var(--ink);font-weight:700;transform:none}
.tab:focus-visible{outline:2px dashed var(--ink);outline-offset:-4px}
/* 寬螢幕：6 個頁籤一排放下、不捲動（字級用 px，不跟著「字體」按鈕放大） */
@media (min-width:900px){
  .tabs{overflow:visible;gap:4px;padding:0 12px 0 70px}
  .tab{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:clamp(12.5px,1.08vw,16px);padding:8px clamp(8px,.9vw,14px) 6px}
}

/* ===== 筆記本紙張 ===== */
.notebook{
  position:relative; background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  border-radius:6px 14px 14px 6px;
  box-shadow:4px 5px 0 var(--shadow-hard);
  padding:28px clamp(16px,3vw,40px) 36px 92px;
  display:flex; flex-direction:column; gap:24px;
}
.notebook::before{content:""; position:absolute; top:0; bottom:0; left:64px;
  border-left:1.5px solid var(--margin); border-right:1.5px solid var(--margin); width:5px;}
.notebook::after{content:""; position:absolute; top:12px; bottom:12px; left:14px; width:24px;
  background:radial-gradient(circle at 12px 18px,var(--hole) 7px,transparent 8px) 0 0/24px 40px repeat-y;}
.notebook>*{min-width:0;max-width:100%}

/* ===== 頁首 ===== */
header{position:relative;padding-right:132px}
.kicker{font-size:.8rem;color:var(--muted);letter-spacing:.12em;margin:0 0 4px}
h1{margin:0;font-size:clamp(1.6rem,4.2vw,2.2rem);font-weight:400;line-height:1.3;display:inline-block;position:relative;cursor:default}
.marker{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 90%,transparent 90%);padding:0 .15em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.squiggle{display:block;width:min(220px,60%);height:12px;margin-top:2px;color:var(--b-ink)}
.sub{margin:10px 0 0;color:var(--ink-soft);font-size:.92rem;max-width:60ch}
.grade{display:flex;flex-wrap:wrap;gap:10px 8px;margin:14px 0 0;padding:0;list-style:none}
/* 防抽搐：li 是固定的命中範圍，上提轉正只動裡面那段膠帶 */
.grade li{font-size:.8rem;cursor:default;display:block}
.grade li>.tape{transition:transform .18s ease}
.grade li:nth-child(odd)>.tape{transform:rotate(-1.2deg)}
.grade li:nth-child(even)>.tape{transform:rotate(1deg)}
.grade li:hover>.tape{transform:translateY(-3px) rotate(0)}
.grade b{font-family:"Huninn",sans-serif;font-weight:400;font-size:1.05em;margin-left:4px;font-variant-numeric:tabular-nums}

/* ===== 貼紙角色 ===== */
.mwrap{position:absolute;right:0;top:-6px;width:112px;height:112px;z-index:3}
.mascot-btn{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;transform:rotate(6deg);border-radius:50%}
.mascot-btn:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
.mascot-btn svg{display:block;width:100%;height:100%;overflow:visible}
.m-txt{font-family:"Huninn",sans-serif}
.m-eye,.m-spark,.m-roll,.m-sweat,.m-cell{transform-box:fill-box;transform-origin:center}
.m-all{transform-origin:60px 104px}
.m-sweat{opacity:0}
.bubble{
  position:absolute; right:calc(100% + 6px); top:8px; width:max-content; max-width:min(260px,62vw);
  background:var(--card); color:var(--ink); border:1.6px solid var(--ink-soft);
  padding:8px 12px; font-family:"Huninn",sans-serif; font-size:.8rem; line-height:1.5;
  border-radius:16px 16px 4px 16px; box-shadow:3px 3px 0 var(--shadow-hard);
  opacity:0; transform:translateY(4px) scale(.92); transform-origin:right top;
  pointer-events:none; transition:opacity .2s ease, transform .2s ease;
}
.bubble.show{opacity:1;transform:none}
.spark{position:absolute;left:50%;top:45%;width:18px;height:18px;margin:-9px;pointer-events:none}
.spark svg{width:100%;height:100%;display:block}

/* ===== 控制列 ===== */
.ctl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.grp{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.grp .lbl{font-family:"Huninn",sans-serif;margin-right:2px}
.btn{
  font-size:.85rem; cursor:pointer; color:var(--ink); background:transparent;
  border:1.6px solid var(--ink-soft); padding:4px 12px; min-height:36px;
  display:inline-flex; align-items:center; gap:6px; line-height:1;
  transition:transform .15s ease;
}
.btn[aria-pressed="true"]{
  border-color:var(--ink); font-weight:700;
  background:linear-gradient(transparent 30%,var(--hl) 30%,var(--hl) 88%,transparent 88%);
}
/* 防抽搐：按鈕外框不動，只讓裡面的圖示＋字微微上提歪一下 */
.btn>*{transition:transform .15s ease}
.btn:hover{border-style:dashed}
.btn:hover>*{transform:translateY(-1px) rotate(-2deg)}
.btn:active>*{transform:translateY(1px)}
.btn:focus-visible{outline:2px dashed var(--c-ink);outline-offset:3px}
.theme-btn{margin-left:auto}

/* ===== 會動的小圖示 ===== */
.ic{width:18px;height:18px;flex:none;overflow:visible}
.ic .rays,.ic .body,.ic .half,.ic .pen,.ic .strip,.ic .pg{transform-origin:12px 12px}
.ic .pen{transform-origin:5px 19px}
.ic .strip{transform-origin:3px 12px}
.ic .nd,.ic .dot,.ic .core,.ic .tw{transform-box:fill-box;transform-origin:center}

/* ===== 本題區 ===== */
.panel{display:flex;flex-direction:column;gap:16px}
.panel h2{margin:0;font-size:1.35rem;font-weight:400;line-height:1.4;text-wrap:balance}
.panel h2 .no{display:inline-block;font-size:.75em;color:var(--paper);background:var(--ink);padding:0 9px;margin:0 4px 0 3px;transform:rotate(-3deg);border-radius:4px 10px 6px 12px;transition:transform .2s ease}
.panel h2:hover .no{transform:rotate(4deg) translateY(-2px)}
.q{margin:0;padding:12px 16px;border:1.6px dashed var(--ink-soft);font-size:.92rem;position:relative;background:var(--card);transition:border-color .2s ease, transform .2s ease}
.q:hover{border-color:var(--c-ink)}
.q .qt{transition:transform .2s ease}
.q:hover .qt{transform:translateX(2px)}
.q .tape{position:absolute;top:-14px;left:14px;font-size:.75rem;transform:rotate(-2deg);--t:var(--c-tape);transition:transform .2s ease}
.q:hover .tape{transform:rotate(3deg) translateY(-2px)}
.q span.qt{display:block;margin-top:4px}
.prog{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin:0;font-family:"Huninn",sans-serif;font-size:.85rem;color:var(--ink-soft)}
.prog .ic{color:var(--a-ink);width:20px;height:20px}
.prog b{font-weight:400;font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{position:relative;display:inline-block;width:min(220px,40vw);height:14px;border:1.6px solid var(--ink-soft);overflow:hidden;vertical-align:middle;transition:transform .2s ease}
.prog:hover .bar{transform:rotate(-1deg) scaleY(1.15)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background-color:var(--a-tape);
  background-image:repeating-linear-gradient(45deg,var(--stripe) 0 4px,transparent 4px 10px);transition:width .5s ease}
.prog .yay{color:var(--a-ink)}
.prog .clr{min-height:30px;font-size:.78rem;padding:3px 10px;margin-left:4px}
.prog .clr .ic{color:currentColor;width:16px;height:16px}
.prog .clr[disabled]{opacity:.45;cursor:default;transform:none;border-style:solid}
.prog .clr[disabled]>*{transform:none}
.prog .clr.armed{color:var(--b-ink);border-color:var(--b-ink);border-style:dashed;font-weight:700;background:linear-gradient(transparent 30%,var(--b-hl) 30%,var(--b-hl) 88%,transparent 88%)}
.ic .er{transform-origin:12px 12px}
@media (prefers-reduced-motion: no-preference){
  .ic.play .er{animation:ic-rub .6s ease}
  @keyframes ic-rub{20%{transform:translate(-2px,1px) rotate(-8deg)}45%{transform:translate(2px,-1px) rotate(6deg)}70%{transform:translate(-1px,1px) rotate(-4deg)}}
  .prog .clr.armed{animation:armed 1s ease-in-out infinite}
  @keyframes armed{50%{transform:rotate(-2deg) translateY(-1px)}}
  .sec-open li{animation:li-in .32s ease-out both;animation-delay:calc(var(--i) * 70ms + 80ms)}
  @keyframes li-in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 8px;scrollbar-width:thin}
.scroll svg.tree{display:block;max-width:none}
.tip{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0;font-size:.8rem;color:var(--muted)}
.tip .ic{width:28px;height:14px;color:var(--muted)}

/* ===== 樹狀圖 ===== */
.tree text{font-family:"LXGW WenKai TC","PingFang TC",sans-serif;fill:var(--ink)}
.tree .t-br,.tree .t-root,.tree .t-badge,.tree .t-cover{font-family:"Huninn","LXGW WenKai TC",sans-serif}
.tree .t-br,.tree .t-cover{fill:var(--tape-ink)}
.tree .t-root{fill:var(--sticky-ink)}
.tree .t-kick{fill:var(--sticky-ink);opacity:.75;font-family:"Huninn",sans-serif}
.tree .sticky{fill:var(--sticky)}
.tree .sticky-tape{fill:var(--e-tape);opacity:.9}
.tree .shadow{fill:var(--shadow-hard)}
.tree .card{fill:var(--card);transition:fill .18s ease}
.tree .icon{color:var(--ink-soft)}
/* 防抽搐：根／枝／葉各有一塊固定不動的透明命中區（.hit），hover 時只動裡面的 .root-in／.br-in／.lf-in */
.tree .hit{fill:transparent;stroke:none;pointer-events:all}
.tree .root-in,.tree .br-in,.tree .lf-in{pointer-events:none}
.tree .root-in{transform-box:fill-box;transform-origin:center;transition:transform .25s ease}
.tree .root-g{cursor:default}
.tree .root-g:hover .root-in{transform:rotate(2.5deg) translateY(-2px)}
/* 枝 */
.tree .br{cursor:pointer;outline:none}
.tree .br-in{transition:transform .18s ease}
.tree .br:hover .br-in,.tree .br:focus-visible .br-in{transform:translateY(-3px)}
.tree .br-sh{fill:var(--shadow-hard);opacity:0;transition:opacity .18s ease}
.tree .br:hover .br-sh,.tree .br:focus-visible .br-sh{opacity:1}
.tree .br:focus-visible .tp{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.tree .badge-in{transform-box:fill-box;transform-origin:center;transition:transform .2s ease}
.tree .br:hover .badge-in,.tree .br:focus-visible .badge-in{transform:scale(1.1)}
.tree .br:hover .is-folded .badge-in,.tree .br:focus-visible .is-folded .badge-in{transform:scale(1.15)}
.tree .lines path{transition:stroke-width .15s ease, opacity .15s ease}
.tree .lines.hot path{stroke-width:3;opacity:1}
/* 葉 */
.tree .leaf{cursor:pointer;outline:none}
.tree .lf-in{transition:transform .18s ease}
.tree .leaf:hover .lf-in,.tree .leaf:focus-visible .lf-in{transform:translate(4px,-1px)}
.tree .leaf:hover .card,.tree .leaf.done .card{fill:var(--lh)}
.tree .lf-edge{transition:stroke-width .15s ease}
.tree .leaf:hover .lf-edge{stroke-width:2.2}
.tree .leaf:focus-visible .lf-edge{stroke-dasharray:5 3;stroke-width:2}
.tree .stamp-hint{opacity:0;transition:opacity .18s ease}
.tree .leaf:not(.done):hover .stamp-hint{opacity:.7}
.stamp-in{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(1.8) rotate(25deg);transition:opacity .2s ease, transform .3s cubic-bezier(.3,1.5,.5,1)}
.done .stamp-in{opacity:1;transform:scale(1) rotate(-10deg)}
.tree .cover{transform-box:fill-box;transform-origin:right top;transition:transform .45s ease, opacity .45s ease}
.tree .leaf:hover .cover{transform:rotate(-1deg) translateY(-2px)}
.tree .peeled .cover,.tree .leaf.peeled:hover .cover{transform:translate(34px,-16px) rotate(9deg);opacity:0;pointer-events:none}

/* ===== 清單 ===== */
.list{display:flex;flex-direction:column;gap:22px}
.list .root{
  align-self:flex-start; background:var(--sticky); color:var(--sticky-ink);
  font-family:"Huninn",sans-serif; padding:14px 20px 12px; transform:rotate(-1.2deg);
  box-shadow:3px 4px 0 var(--shadow-hard); position:relative; max-width:100%; transition:box-shadow .25s ease;
}
/* 防抽搐：便利貼本身不動，滑過時硬陰影加深、頂端膠帶轉一下 */
.list .root:hover{box-shadow:5px 7px 0 var(--shadow-hard)}
.list .root::before{content:"";position:absolute;top:-10px;left:50%;width:72px;height:20px;margin-left:-36px;background:var(--e-tape);opacity:.9;transform:rotate(3deg);transition:transform .25s ease}
.list .root:hover::before{transform:rotate(-3deg)}
.list .root small{display:block;font-size:.72rem;opacity:.75;letter-spacing:.15em}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:24px 32px;align-items:start}
.list section{padding-left:4px;min-width:0}
.list h3{margin:0 0 8px;font-size:1.02rem;font-weight:400}
.br-btn{--t:var(--bt);border:0;cursor:pointer;font-size:1.02rem;padding:3px 18px;display:inline-flex;align-items:center;gap:8px;line-height:1.5;text-align:left;transition:transform .18s ease}
.list section:nth-child(odd) .br-btn{transform:rotate(-1deg)}
.list section:nth-child(even) .br-btn{transform:rotate(.8deg)}
/* 防抽搐：膠帶標籤本身不動，滑過時斜紋往旁邊滑、數字圈放大 */
.br-btn{background-position:0 0;transition:background-position .35s ease}
.list section .br-btn:hover{background-position:10px 0}
.br-btn .cnt{transition:transform .2s ease}
.list section .br-btn:hover .cnt{transform:scale(1.15) rotate(-8deg)}
.br-btn:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.br-btn .cnt{font-size:.72rem;min-width:1.7em;height:1.7em;display:inline-grid;place-items:center;border-radius:50%;background:var(--card);color:var(--bi);border:1.4px solid var(--bi)}
.br-btn .ic{width:16px;height:16px;transition:transform .25s ease}
.folded .br-btn .ic{transform:rotate(-90deg)}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
.folded .fold{grid-template-rows:0fr}

.list .cover{

}
.list li.leaf:hover .cover{transform:rotate(-.6deg) translateY(-1px)}
.list .peeled .cover,.list li.leaf.peeled:hover .cover{transform:translate(28px,-12px) rotate(7deg);opacity:0;pointer-events:none}

function countUp(node, to, from = 0, suffix = "", dur = 750){
  if (!motion()){ node.textContent = to + suffix; return; }
  cancelAnimationFrame(node._raf);
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(from + (to - from) * e) + suffix;
    if (p < 1) node._raf = requestAnimationFrame(step);
  };
  node._raf = requestAnimationFrame(step);
}

function wrap(text, max, size, fam){
  const toks = text.match(/\{book\}|\{pen\}|[A-Za-z0-9.,'’\-\/~²µ+]+|\s+|[^\sA-Za-z0-9.,'’\-\/~²µ+]/g) || [];
  const lines = []; let line = "", w = 0;
  for (const tk of toks){

    if (w + k > max && line.trim()){ lines.push(line.trimEnd()); line = ""; w = 0; if (/^\s+$/.test(tk)) continue; }

}

  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 1; i <= 4; i++){
    const a = p[i - 1], b = p[i % 4];
    const mx = (a[0] + b[0]) / 2 + j(), my = (a[1] + b[1]) / 2 + j();
    d += ` Q${mx.toFixed(1)},${my.toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`;

}

function tapePoly(x, y, w, h){

function draw(t, ti, opt = {}){

    });

  b.firstChild.onclick = () => { recite = !recite; store.set("b-sample-recite", recite ? "1" : "0"); peeled.clear(); reciteBtn(); play(b.firstChild); b.firstChild.focus(); renderView({}); setTip(); };
}

/* ---------- 分頁 ---------- */
let cur = 0, first = true;
function renderView(opt){
  const sc = document.getElementById("sc"), t = T[cur];
  sc.replaceChildren(curView() === "list" ? listView(t, cur) : draw(t, cur, opt));
}
function setTip(){
  const tip = document.querySelector(".tip"); if (!tip) return;
  const tree = curView() !== "list";
  tip.innerHTML = (tree ? `${ic("swipe")}` : "") + (recite ? "背誦模式：先在心裡默背，再點紙膠帶撕開對答案；撕開後再點一下就蓋「背過了」貼紙。" :
    tree ? "點樹枝（彩色膠帶）收合／展開，點葉子蓋上「背過了」貼紙；手機上可以左右滑動看整棵樹。" : "點彩色標籤收合／展開，點一行蓋上「背過了」貼紙。");
}
function show(i, anim = true){
  const changed = i !== cur || first;
  if (i !== cur) peeled.clear();
  cur = i;
  document.querySelectorAll(".tab").forEach((b, k) => { b.setAttribute("aria-selected", String(k === i)); b.tabIndex = k === i ? 0 : -1; });
  const t = T[i], p = document.getElementById("panel");
  p.classList.remove("panel-in"); if (anim && motion()){ void p.offsetWidth; p.classList.add("panel-in"); }
  p.innerHTML = `<h2>申論題<span class="no">${t.k}</span>｜${esc(t.title)}</h2>
    <p class="q"><span class="tape">Q.</span><span class="qt">題目要點：${esc(t.q)}</span></p>
    <p class="prog">${ic("check")}這題背過了 <b>0</b> / <span class="tot"></span><span class="bar rough"><i></i></span><span class="yay"></span><button type="button" class="btn rough clr">${ic("eraser")}<span>清空本題</span></button></p>
    <div class="scroll" id="sc"></div>
    <p class="tip"></p>`;
  renderView({ anim: anim && changed });
  setTip();
  shownN = 0; updateProg(anim && changed);
  if (anim && changed) grades();
  setMascot(i, anim && !first);
  store.set("b-sample-tab", String(i));
  first = false;
}
const tabs = document.getElementById("tabs");
T.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
  b.style.setProperty("--t", `var(--${HUES[i]}-tape)`);
  const tin = document.createElement("span"); tin.className = "tab-in";
  tin.textContent = `${t.k}｜${t.title.split("＋")[0].split(" vs ")[0]}`; b.appendChild(tin);
  b.onclick = () => { if (i !== cur) show(i); };
  b.onkeydown = e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const n = (i + (e.key === "ArrowRight" ? 1 : T.length - 1)) % T.length;
    show(n); tabs.children[n].focus();
  };
  tabs.appendChild(b);
});

/* ---------- 字體大小 ---------- */
(function(){
  const SIZES = [["小",16],["中",19],["大",22],["特大",25]];
  let px = +(store.get("b-sample-font") || 19) || 19;
  const box = document.getElementById("fsz");
  box.innerHTML = `<span class="lbl">字體</span>` + SIZES.map(([n, v]) => `<button type="button" class="btn rough" data-px="${v}"><span>${n}</span></button>`).join("");
  function apply(v, redraw){
    px = v; window.__fontPx = v; document.documentElement.style.fontSize = v + "px";
    store.set("b-sample-font", String(v));
    box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.px === v)));
    if (redraw) renderView({});
  }
  box.querySelectorAll("button").forEach(b => b.onclick = () => apply(+b.dataset.px, true));
  apply(px, false);
})();

/* ---------- 淺色／深色：跟隨系統 → 淺色 → 深色 ---------- */
(function(){
  const btn = document.getElementById("theme");
  const MODES = { auto: ["跟隨系統", "auto"], light: ["淺色", "sun"], dark: ["深色", "moon"] };
  let mode = store.get("b-sample-theme") || "auto";
  if (!MODES[mode]) mode = "auto";
  function apply(){
    if (mode === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    btn.innerHTML = `${ic(MODES[mode][1])}<span>主題：${MODES[mode][0]}</span>`;
  }
  btn.onclick = () => { mode = mode === "auto" ? "light" : mode === "light" ? "dark" : "auto"; store.set("b-sample-theme", mode); apply(); play(btn); };
  apply();
})();

modeBtns(); reciteBtn();
let start = +(store.get("b-sample-tab") || 0) || 0;
show(Math.min(Math.max(start, 0), T.length - 1), true);

/* 字型載入後、視窗寬度改變時重畫（不重播動畫） */
let rt, lastW = 0;
const redrawQuiet = () => { clearTimeout(rt); rt = setTimeout(() => { if (curView() === "tree") renderView({}); }, 120); };
if (document.fonts){ document.fonts.ready.then(redrawQuiet); document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", redrawQuiet); }
new ResizeObserver(es => { const w = Math.round(es[0].contentRect.width); if (Math.abs(w - lastW) > 2){ lastW = w; redrawQuiet(); } }).observe(document.querySelector(".notebook"));
mqMobile.addEventListener && mqMobile.addEventListener("change", () => { if (!view){ modeBtns(); renderView({}); setTip(); } });
</script>
