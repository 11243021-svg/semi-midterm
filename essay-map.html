const NS = "http://www.w3.org/2000/svg";
const COLS = ["c1","c2","c3","c4","c5","c6"];
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function wrap(text, max){
  // 英文、數字連在一起當成一個單位，不從中間切斷
  const toks = text.match(/[A-Za-z0-9.,'’\-\/~²µ+]+|\s+|[^\sA-Za-z0-9.,'’\-\/~²µ+]/g) || [];
  const tw = s => [...s].reduce((a, c) => a + (c.charCodeAt(0) < 256 || "²µ’".includes(c) ? 0.56 : 1), 0);
  const lines = []; let line = "", w = 0;
  for (const tk of toks) {
    const k = tw(tk);
    if (w + k > max && line.trim()) { lines.push(line.trimEnd()); line = ""; w = 0; if (/^\s+$/.test(tk)) continue; }
    line += tk; w += k;
  }
  if (line.trim()) lines.push(line.trimEnd());
  return lines;
}
function draw(t){
  const FS = 14, LH = 20, PAD = 9, GAP = 10, BGAP = 18; const K = (window.__fontPx || 19) / 15;
  const ROOT_W = 170, BR_W = 190, LF_W = 330, X0 = 4, X1 = ROOT_W + 50, X2 = X1 + BR_W + 46;
  const W = X2 + LF_W + 6;
  // 先算每個葉子的高度
  let y = 8; const branches = [];
  t.b.forEach(([name, leaves], bi) => {
    const items = leaves.map(s => { const ls = wrap(s, 21); return { ls, h: ls.length * LH + PAD * 2 }; });
    const top = y;
    items.forEach(it => { it.y = y; y += it.h + GAP; });
    const bottom = y - GAP;
    const bl = wrap(name, 11);
    const bh = bl.length * LH + PAD * 2;
    branches.push({ name: bl, items, cy: (top + bottom) / 2, bh, col: COLS[bi % COLS.length] });
    y += BGAP;
  });
  const H = y - BGAP + 8;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: Math.round(W * K), height: Math.round(H * K), role: "img", "aria-label": `申論題${t.k}重點樹：${t.title}` });
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue("--" + n).trim();
  const rootLines = wrap(t.title, 9);
  const rh = rootLines.length * 22 + 28, ry = H / 2 - rh / 2;
  // 連線
  branches.forEach(b => {
    el("path", { d: `M${X0 + ROOT_W},${H / 2} C${X0 + ROOT_W + 30},${H / 2} ${X1 - 30},${b.cy} ${X1},${b.cy}`, fill: "none", stroke: v(b.col), "stroke-width": 2.2, opacity: .85 }, svg);
    b.items.forEach(it => {
      const ly = it.y + it.h / 2;
      el("path", { d: `M${X1 + BR_W},${b.cy} C${X1 + BR_W + 24},${b.cy} ${X2 - 24},${ly} ${X2},${ly}`, fill: "none", stroke: v(b.col), "stroke-width": 1.5, opacity: .7 }, svg);
    });
  });
  // 根
  el("rect", { x: X0, y: ry, width: ROOT_W, height: rh, rx: 16, fill: v("root") }, svg);
  const rk = el("text", { x: X0 + ROOT_W / 2, y: ry + 22, "text-anchor": "middle", "font-size": 12, fill: v("rootink"), opacity: .85, "letter-spacing": 2 }, svg); rk.textContent = `申論題${t.k}`;
  rootLines.forEach((s, i) => { const tx = el("text", { x: X0 + ROOT_W / 2, y: ry + 44 + i * 22, "text-anchor": "middle", "font-size": 16, "font-weight": 700, fill: v("rootink") }, svg); tx.textContent = s; });
  // 枝與葉
  branches.forEach(b => {
    const by = b.cy - b.bh / 2;
    el("rect", { x: X1, y: by, width: BR_W, height: b.bh, rx: 12, fill: v(b.col) }, svg);
    b.name.forEach((s, i) => { const tx = el("text", { x: X1 + 14, y: by + PAD + 15 + i * LH, "font-size": 15, "font-weight": 700, fill: v("brink") }, svg); tx.textContent = s; });
    b.items.forEach(it => {
      el("rect", { x: X2, y: it.y, width: LF_W, height: it.h, rx: 10, fill: v(b.col + "s"), stroke: v(b.col), "stroke-width": 1 }, svg);
      it.ls.forEach((s, i) => { const tx = el("text", { x: X2 + 12, y: it.y + PAD + 14 + i * LH, "font-size": FS, fill: v("ink") }, svg); tx.textContent = s; });
    });
  });
  return svg;
}

}

  const t = T[i], p = document.getElementById("panel");
  p.innerHTML = `<h2>申論題${t.k}｜${t.title}</h2><p class="q">題目要點：${t.q}</p><div class="scroll" id="sc"></div><p class="tip">手機上可以左右滑動看整棵樹</p>`;
  document.getElementById("sc").appendChild(curView() === "list" ? listView(t) : draw(t));
  const tip = p.querySelector(".tip"); if (tip) tip.hidden = curView() === "list";
  try { localStorage.setItem("essay-map-tab", String(i)); } catch(e) {}
}
const tabs = document.getElementById("tabs");
T.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
  b.textContent = `${t.k}｜${t.title.split("＋")[0].split(" vs ")[0]}`;
  b.onclick = () => show(i);
  tabs.appendChild(b);
});
let start = 0; try { start = +(localStorage.getItem("essay-map-tab") || 0) || 0; } catch(e) {}
window.__onFont = px => { window.__fontPx = px; if (typeof cur === 'number' && document.getElementById('sc')) show(cur); };
(function(){
  const SIZES = [["小",16],["中",19],["大",22],["特大",25]];
  let cur = 19; try { cur = +(localStorage.getItem("semi-font") || 19) || 19; } catch(e) {}
  const box = document.getElementById("fsz");
  function apply(px){
    cur = px; document.documentElement.style.fontSize = px + "px";
    try { localStorage.setItem("semi-font", String(px)); } catch(e) {}
    box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.px === px)));
    if (window.__onFont) window.__onFont(px);
  }
  box.innerHTML = "字體：" + SIZES.map(([n, px]) => `<button type="button" data-px="${px}">${n}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => apply(+b.dataset.px));
  apply(cur);
})();

modeBtns();
show(Math.min(start, T.length - 1));
const mq = window.matchMedia("(prefers-color-scheme: dark)");
if (mq.addEventListener) mq.addEventListener("change", () => show(cur));
new MutationObserver(() => show(cur)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
